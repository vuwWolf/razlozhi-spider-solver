name: Build macOS

# electron-builder не умеет собирать macOS-приложения на Windows/Linux,
# поэтому сборка идёт на macOS-раннере и доступна вручную.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build universal macOS app (dmg + zip)
        run: npm run dist:mac

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Solver-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Solver-macos-zip
          path: dist/*.zip
          if-no-files-found: error
