name: Build macOS

# electron-builder не умеет собирать macOS-приложения на Windows/Linux,
# поэтому сборка идёт на macOS-раннере и доступна вручную.
# Архитектуры собираются отдельными job-ами, чтобы получить отдельные DMG/ZIP.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build macOS app (${{ matrix.arch }}, dmg + zip)
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Upload DMG (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Solver-macos-${{ matrix.arch }}-dmg
          path: dist/*-${{ matrix.arch }}.dmg
          if-no-files-found: error

      - name: Upload ZIP (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Solver-macos-${{ matrix.arch }}-zip
          path: dist/*-${{ matrix.arch }}.zip
          if-no-files-found: error
